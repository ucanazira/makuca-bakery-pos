<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Promo - Bakery POS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <div class="pos-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <img src="img/logo-putih.png" alt="Bakery Makuca Logo" style="max-width: 180px; height: auto;">
                </div>
                <button class="close-sidebar" onclick="toggleSidebar()">&times;</button>
            </div>
            
            <nav class="sidebar-menu">
                <a href="index.html">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    Kasir
                </a>
                <a href="laporan.html">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    Laporan Penjualan
                </a>
                <a href="manajemen.html">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Manajemen Produk
                </a>
                <a href="promo.html" class="active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                    Manajemen Promo
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout-sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Log Out
                </button>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <!-- KONTEN UTAMA -->
        <div class="main-content" style="margin-right: 0;">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="btn-menu" onclick="toggleSidebar()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <h1 style="font-size: 24px; color: #3E2723; margin-left: 10px;">Manajemen Promo</h1>
                </div>
                <button onclick="bukaModalPromo()" class="btn-primary" style="width: auto; padding: 12px 24px; border-radius: 30px;">
                    + Tambah Promo Baru
                </button>
            </header>

            <!-- TABEL DAFTAR PROMO -->
            <div class="card" style="background: white; padding: 30px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
                <div class="table-responsive">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 2px solid #f1f5f9; color: #64748b; font-size: 14px;">
                                <th style="padding: 12px;">Kode Promo</th>
                                <th style="padding: 12px;">Diskon</th>
                                <th style="padding: 12px;">Min. Belanja</th>
                                <th style="padding: 12px;">Mulai</th>
                                <th style="padding: 12px;">Berakhir</th>
                                <th style="padding: 12px;">Status</th>
                                <th style="padding: 12px; text-align: center;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-promo-body">
                            <!-- Data diisi otomatis oleh JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH PROMO -->
    <div id="modal-promo" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="tutupModalPromo()">&times;</span>
            <h2>Tambah Promo</h2>
            <form id="form-promo">
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px; color:#334155;">Kode Promo</label>
                <input type="text" id="kode-promo" required placeholder="Cth: LEBARAN10" style="margin-bottom:15px; width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px; text-transform:uppercase;">
                
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px; color:#334155;">Diskon (%)</label>
                <input type="number" id="diskon-promo" required placeholder="Cth: 10" min="1" max="100" style="margin-bottom:15px; width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px;">

                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px; color:#334155;">Minimum Belanja (Rp)</label>
                <input type="number" id="min-belanja-promo" required placeholder="Cth: 50000" min="0" style="margin-bottom:15px; width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px;">
                
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px; color:#334155;">Tanggal Mulai</label>
                <input type="date" id="mulai-promo" required style="margin-bottom:15px; width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px;">
                
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px; color:#334155;">Tanggal Berakhir</label>
                <input type="date" id="berakhir-promo" required style="margin-bottom:20px; width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px;">
                
                <button type="submit" class="btn-primary">Simpan Promo</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
